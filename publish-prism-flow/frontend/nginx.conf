server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed Vite assets.
  location /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Forward /api/* to the backend so the frontend can reach FastAPI through
  # the same origin in production. Override BACKEND_HOST at runtime by
  # mounting a custom default.conf (or rebuild with a different proxy_pass).
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 200m;
  }

  # SPA fallback — let React Router handle deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
